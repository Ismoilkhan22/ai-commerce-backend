# 23-dev-setup-and-workflow §2: ruff, mypy, secret scan, lint-imports
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: mypy
        name: mypy (app/)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: lint-imports
        name: import-linter (qatlamlar)
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
