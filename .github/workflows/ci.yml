name: ci

# 22 §6.1. Integratsiya testlari PostgreSQL 16 va Redis 7 ni testcontainers bilan ko'taradi — GitHub'ning
# ubuntu runner'ida Docker bor, shuning uchun alohida `services: postgres` kerak emas (lokal bilan bir xil yo'l).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Docker bor (testcontainers; bo'lmasa integratsiya testlari jim o'tkazib yuboriladi)
        run: docker info --format '{{.ServerVersion}}'
      - name: make check (ruff, mypy, import-linter, pytest)
        run: make check

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend image build (push yo'q)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          tags: cos-backend:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Production compose fayli to'g'ri
        run: |
          cp deploy/.env.prod.example deploy/.env.prod
          cp deploy/app.env.example deploy/app.env
          touch deploy/secrets/cloudflare.ini
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod config -q
      - name: nginx konfiguratsiyasi to'g'ri (o'z-o'zidan imzolangan sertifikat bilan)
        run: |
          mkdir -p /tmp/le/live/platforma.uz
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=platforma.uz" \
            -keyout /tmp/le/live/platforma.uz/privkey.pem -out /tmp/le/live/platforma.uz/fullchain.pem
          docker run --rm -e PLATFORM_DOMAIN=platforma.uz \
            --add-host api:127.0.0.1 --add-host shop-dashboard:127.0.0.1 \
            --add-host platform-admin:127.0.0.1 --add-host shop-storefront:127.0.0.1 \
            -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/nginx/templates:/etc/nginx/templates:ro" \
            -v "$PWD/deploy/nginx/snippets:/etc/nginx/snippets:ro" \
            -v /tmp/le:/etc/letsencrypt:ro \
            nginx:1.28-alpine sh -c '/docker-entrypoint.sh nginx -t'
