# Rasmiy image'ning nginx.conf o'rniga: unda `access_log ... main` ($request — query string bilan) bor edi.
# Yagona kirish logi — conf.d/default.conf'dagi `cos_json` (yo'l query'siz va tokenlar niqoblangan, 09 §4.2).
user  nginx;
worker_processes  auto;
error_log  /dev/stderr warn;
pid        /run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    include /etc/nginx/conf.d/*.conf;
}
