# Har proksi location uchun umumiy sarlavhalar (22 §8).
# X-Forwarded-For: mijoz yozgan zanjir saqlanadi, haqiqiy IP ($remote_addr) OXIRIGA qo'shiladi. Backend
# (TRUSTED_PROXIES) va shop sayti (STOREFRONT_TRUSTED_PROXY_HOPS=1) o'ngdan o'qiydi — chapdagi soxta qiymat
# hisobga olinmaydi. nginx — chekka qatlam (oldida CDN/Cloudflare proksi yo'q), shuning uchun real_ip kerak emas.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-ID      $request_id;
# WebSocket: Upgrade bo'lsa — "upgrade", bo'lmasa bo'sh (upstream bilan keep-alive). Map — default.conf'da
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
