# Lokal muhit: PostgreSQL 16, Redis 7 (AOF) (22, 23 §3).
# Fayllar lokalda diskda (`var/storage`, FileStorage porti) — MinIO kerak emas (TD-03)
# Portlar 5433 / 6380: dasturchi kompyuteridagi o'z PostgreSQL (5432) va Redis (6379) bilan to'qnashmasin
name: commerce-os

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: commerce_os
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d commerce_os"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["6380:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
