# PC compatibility check (engineering/17 §6)
compat:
  categories:
    CPU: "CPU"
    MOTHERBOARD: "motherboard"
    GPU: "graphics card"
    RAM: "memory"
    PSU: "power supply"
    CASE: "case"
    CPU_COOLER: "CPU cooler"
    STORAGE: "storage drive"
  rules:
    REQUIRED_PARTS: "The build is missing: {missing}."
    DISPLAY_OUTPUT: "The CPU has no integrated graphics and no graphics card is selected — there will be no display output."
    CPU_COOLER_PRESENT: "The CPU is sold without a cooler and no cooler is selected."
    DUPLICATE_PART: "The build has {count} × {category} — there should be one."
    UNLINKED_PART: "This {category} is not linked to the hardware spec library — compatibility cannot be checked."
    CPU_MB_SOCKET: "CPU socket ({cpu_socket}) does not match motherboard socket ({mb_socket})."
    BIOS_SUPPORT:
      not_listed: "{cpu_model} is not on the motherboard's supported CPU list — needs expert review."
      unknown_shipped: "{cpu_model} needs BIOS {min_bios} or newer; the board's BIOS version is unknown."
      update_needed: "{cpu_model} needs BIOS {min_bios} or newer; the board ships with {shipped_bios} — an update is required."
    RAM_TYPE_MB: "Memory type ({ram_type}) does not match the motherboard ({mb_type})."
    RAM_TYPE_CPU: "The CPU supports {cpu_types} memory; the selected memory is {ram_type}."
    RAM_FORM_FACTOR: "This memory ({form_factor}) is for laptops — a desktop needs DIMM."
    RAM_SLOTS: "{modules} memory modules, but the motherboard has {slots} slots."
    RAM_CAPACITY: "Total memory is {total_gb} GB; the motherboard supports at most {max_gb} GB."
    MB_CASE_FORM_FACTOR: "The motherboard ({mb_form_factor}) does not fit the case — the case supports: {case_form_factors}."
    GPU_CASE_LENGTH: "The graphics card is {gpu_length_mm} mm; the case fits at most {max_gpu_length_mm} mm."
    COOLER_SOCKET: "The cooler does not support socket {cpu_socket} (supports: {cooler_sockets})."
    COOLER_HEIGHT_CASE: "The cooler is {cooler_height_mm} mm tall; the case fits at most {max_cooler_height_mm} mm."
    AIO_RADIATOR_CASE: "A {radiator_mm} mm radiator does not fit the case (supported: {case_radiators} mm)."
    PSU_CASE_FORM_FACTOR:
      too_big: "A {psu_form_factor} power supply does not fit a {case_psu_form_factor} case."
      adapter: "A {psu_form_factor} power supply fits a {case_psu_form_factor} case only with an adapter bracket."
    PSU_CASE_LENGTH: "The power supply is {psu_length_mm} mm long; the case fits up to {max_psu_length_mm} mm — cable room may be tight."
    STORAGE_M2_SLOTS: "{drives} M.2 drives, but the motherboard has {slots} M.2 slots."
    STORAGE_SATA_PORTS: "{drives} SATA drives, but the motherboard has {ports} SATA ports."
    PSU_WATTAGE: "The power supply is {psu_w} W; the system draws about {estimated_w} W — not enough."
    PSU_HEADROOM: "The {psu_w} W power supply will work, but headroom is low. Recommended: at least {recommended_w} W."
    PSU_GPU_CONNECTORS:
      missing: "The power supply does not have the connectors the graphics card needs."
      adapter: "The power supply has no 16-pin connector for the graphics card — it can only be connected through an adapter."
    COOLER_TDP: "The cooler is rated for {cooler_tdp_w} W; the CPU is {cpu_base_w} W — it may overheat."
    RAM_SPEED: "Memory is {ram_speed} MT/s; the motherboard supports up to {mb_max_speed} MT/s — memory will run slower."
    SINGLE_CHANNEL: "A single memory module — dual-channel mode will not work, performance is lower."
    MIXED_RAM_KITS: "Memory from different kits ({kits}) — stable operation together is not guaranteed."
    NO_UPGRADE_SLOT: "All {slots} memory slots are used — no room for a later upgrade."
    MISSING_ATTRIBUTE: "The spec library has no “{attribute}” data for the {category} — expert review is required."
  public:
    expert_checked: "A shop specialist has checked and approved this build."
  hints:
    ADD_PARTS: "Add: {categories}."
    ADD_GPU: "Add a graphics card or choose a CPU with integrated graphics."
    ADD_COOLER: "Add a CPU cooler."
    LINK_SPEC: "Link the product to a library model or send a new model request."
    MATCH_SOCKET: "Choose a motherboard with socket {socket}."
    CHECK_BIOS: "Check the board's BIOS version (at least {min_bios})."
    UPDATE_BIOS: "Update the BIOS to {min_bios} or newer before handover."
    MATCH_RAM_TYPE: "Choose {type} memory."
    BIGGER_CASE: "Choose a case that fits a {form_factor} board."
    CASE_GPU_LENGTH: "Choose a case that fits a graphics card of at least {min_mm} mm."
    PSU_MIN_WATTAGE: "A power supply of at least {min_w} W is required."
    PSU_RECOMMENDED_WATTAGE: "A power supply of at least {min_w} W is recommended."
    PSU_CONNECTORS: "Choose a power supply with the connectors the graphics card needs."
    PSU_NATIVE_16PIN: "Prefer a power supply with a native 16-pin (12VHPWR/12V-2x6) connector instead of an adapter."
    DUAL_CHANNEL: "Choose a two-module kit (2×)."
