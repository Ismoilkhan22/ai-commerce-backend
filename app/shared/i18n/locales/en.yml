    INVALID_CHOICE: "Value not recognised"
    INVALID_FORMAT: "Invalid format"
    TOO_LONG: "Too long"
    UNSAFE_VALUE: "Starts with a formula character (=, +, -, @)"
    DUPLICATE_IN_FILE: "SKU appears more than once in the file"
    UNKNOWN_BRANCH: "Branch not found"
    NO_EXCHANGE_RATE: "USD price but the shop has no exchange rate"
    NOT_FOUND: "No such SKU"
    ARCHIVED: "Product is archived"
    STOCK_BELOW_COMMITTED: "Stock is below what is reserved for orders"
    PRODUCT_NOT_AVAILABLE: "Stock cannot be added for this product"
    BRANCH_CLOSED: "Branch is closed"
    OUT_OF_SCOPE: "Branch is outside your scope"
    CURRENCY_CONFLICT: "Price symbol conflicts with the currency column ($ vs UZS)"
    IMPORTER_INACTIVE: "The staff member who started the import is disabled"
    INVALID: "Invalid value"
  file_reasons:
