# Sayt buyurtma formasi va maxfiylik siyosati (26 §8). O'zgarsa — app/shared/consent.py dagi versiya ham
consent:
  storefront_order: "Buyurtma bo‘yicha bog‘lanish uchun ism, telefon va manzilim ishlatilishiga roziman."
privacy:
  title: "Maxfiylik siyosati"
  intro: "{shop_name} ({legal_name}, STIR {tin}) saytida buyurtma berganingizda maʼlumotlaringiz shu siyosat bo‘yicha ishlatiladi."
  data: "Biz faqat buyurtma uchun kerakli maʼlumotni olamiz: ism, telefon raqami, yetkazib berishda — manzil va izohingiz."
  purpose: "Maʼlumotlar faqat buyurtmangiz bo‘yicha siz bilan bog‘lanish, buyurtmani tayyorlash va topshirish uchun ishlatiladi. Reklama yuborilmaydi."
  storage: "Telefon va manzil shifrlangan holda saqlanadi. Buyurtma va kafolat muddati tugagach shaxsiy maʼlumotlar o‘chiriladi, buyurtma raqamlari esa hisobot uchun qoladi."
  rights: "Maʼlumotlaringizni ko‘rish, tuzatish yoki o‘chirishni so‘rashingiz mumkin."
  contact: "Savol va so‘rovlar uchun: {contact}."
