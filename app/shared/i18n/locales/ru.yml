# Форма заказа на сайте и политика конфиденциальности (26 §8). При изменении — обновить версию в app/shared/consent.py
consent:
  storefront_order: "Согласен на использование моего имени, телефона и адреса для связи по заказу."
privacy:
  title: "Политика конфиденциальности"
  intro: "При оформлении заказа на сайте {shop_name} ({legal_name}, ИНН {tin}) ваши данные используются согласно этой политике."
  data: "Мы получаем только данные, нужные для заказа: имя, номер телефона, при доставке — адрес и ваш комментарий."
  purpose: "Данные используются только для связи с вами по заказу, его подготовки и выдачи. Рекламу мы не отправляем."
  storage: "Телефон и адрес хранятся в зашифрованном виде. После окончания заказа и гарантии личные данные удаляются, номера заказов остаются для отчётности."
  rights: "Вы можете запросить просмотр, исправление или удаление своих данных."
  contact: "По вопросам и запросам: {contact}."
