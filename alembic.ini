# Har schema uchun alohida Alembic env (ADR-035): `alembic -n <schema> upgrade head`
# URL: ALEMBIC_DATABASE_URL yoki Settings().database_migrator_url (app_migrator roli).

[platform]
script_location = app/db/migrations/platform
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

